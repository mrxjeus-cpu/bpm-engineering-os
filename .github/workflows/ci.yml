name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # macOS: runner tính ×10 phút hạn mức trên repo private ⇒ chỉ chạy theo lịch tuần
    # (02:00 UTC thứ Hai). Push/PR chỉ chạy ubuntu + windows.
    - cron: "0 2 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # Một OS fail không dừng OS khác — cần biết lỗi là đa nền tảng hay chỉ một nền tảng.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # npm ci (không phải install) để khẳng định package-lock.json đủ và khớp package.json.
      - name: Install
        run: npm ci --no-audit --no-fund

      # Test tạo git repo tạm và commit; một số môi trường CI không có identity sẵn.
      - name: Git identity
        run: |
          git config --global user.name "engineering-os CI"
          git config --global user.email "ci@example.invalid"

      - name: Typecheck
        run: npm run typecheck

      # npm test = build (tsc) + toàn bộ test, gồm guard đa nền tảng (tests/paths-contract.test.mjs).
      - name: Build and test
        run: npm test

      # Khi fail: giữ lại state workstream (.engineering) để xem evidence/log thật.
      - name: Upload workstream state on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-os-state-${{ matrix.os }}
          path: .engineering
          if-no-files-found: ignore
          retention-days: 7

  # Cùng bộ bước như job trên, chạy theo lịch để vẫn phủ macOS mà không tốn hạn mức mỗi push.
  test-macos:
    name: test (macos-latest, theo lịch)
    if: github.event_name == 'schedule'
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Git identity
        run: |
          git config --global user.name "engineering-os CI"
          git config --global user.email "ci@example.invalid"

      - name: Build and test
        run: npm test
